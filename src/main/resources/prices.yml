# Precos globais por material.
# Configure o "pai" (bloco) e o plugin calcula o "filho" (item) automaticamente via
# receitas de crafting reversiveis (9x/4x item -> 1 bloco). Ou configure o item direto.
# Material sem entrada aqui = nao vendavel.
#
# "category" (opcional) agrupa materiais pra /vendertudo <categoria>, pro filtro do
# menu de auto-venda (/venderautomatico) e pras permissoes alkashop.autosell.<categoria>.
# Nao precisa em todo material - so onde fizer sentido categorizar.

prices:
