name: AlkaShop
version: '${version}'
main: com.alkacode.shop.AlkaShopPlugin
api-version: '1.21.8'
author: MestreDEV
description: Sistema universal de vendas - precos globais por material, calculo inteligente de proporcoes via receitas de crafting, multiplas moedas via AlkaEconomy.
depend: [AlkaEconomy]
softdepend: [PlaceholderAPI, AlkaDrop]

commands:
  vender:
    description: Abre a GUI principal de vendas.
    usage: /<command>
  vendertudo:
    description: Vende todo o inventario, ou so uma categoria.
    usage: /<command> [categoria]
  vendermao:
    description: Vende o item na mao principal.
    usage: /<command>
  vendersel:
    description: Abre o bau virtual de venda selecionada.
    usage: /<command>
  venderautomatico:
    description: Configura a venda automatica por material/categoria (VIP).
    usage: /<command> [todos|nenhum|<material>]
    aliases: [autosell]
  venderpreco:
    description: Ve o preco de um material.
    usage: /<command> <material>
  alkashop:
    description: Comando administrativo do AlkaShop.
    usage: /<command> <reload|setprice|removeprice|debug|toggle|info>

permissions:
  alkashop.use:
    description: Permite usar comandos de venda.
    default: true
  alkashop.autosell:
    description: Permite ativar venda automatica (VIP).
    default: false
  alkashop.autosell.all:
    description: Permite ativar auto-venda para todos os itens de uma vez.
    default: false
  alkashop.autosell.minerios:
    description: Permite auto-vender materiais da categoria minerios.
    default: false
  alkashop.autosell.fazenda:
    description: Permite auto-vender materiais da categoria fazenda.
    default: false
  alkashop.autosell.madeira:
    description: Permite auto-vender materiais da categoria madeira.
    default: false
  alkashop.admin.reload:
    description: Recarregar config/precos.
    default: op
  alkashop.admin.setprice:
    description: Definir/remover precos.
    default: op
  alkashop.admin.debug:
    description: Modo debug.
    default: op
  alkashop.admin.others:
    description: Controlar config de outros jogadores.
    default: op
  alkashop.admin.info:
    description: Ver estatisticas de outros jogadores.
    default: op
